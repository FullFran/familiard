[package]
name = "familiard"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
familiard-agents = { path = "../agents" }
familiard-application = { path = "../application" }
familiard-caption = { path = "../caption" }
familiard-domain = { path = "../domain" }
familiard-gallery = { path = "../gallery" }
familiard-pack = { path = "../pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
familiard-stage-terminal = { path = "../stage-terminal" }

[target.'cfg(target_os = "linux")'.dependencies]
familiard-stage-wayland = { path = "../stage-wayland" }

[target.'cfg(windows)'.dependencies]
familiard-stage-windows = { path = "../stage-windows" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# Already in the workspace through familiard-pack. Draws spritesheets of the standard sizes.
image = { version = "0.25", default-features = false, features = ["png"] }

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary also runs on older glibc.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: The tag must match the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo test --workspace
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }} -p familiard
      - name: Package
        shell: bash
        run: |
          name="familiard-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "dist/$name/pets"
          cp target/${{ matrix.target }}/release/familiard* "dist/$name/"
          rm -f "dist/$name"/*.d "dist/$name"/*.pdb
          cp -r pets/demo "dist/$name/pets/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -bd "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --generate-notes

  # After publish on purpose: Mozilla may take a while or refuse, and the binaries
  # must ship regardless. Rerunning this job for a version Mozilla already accepted
  # fails, because a version cannot be uploaded twice.
  extension:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The manifest takes the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' extension/manifest.json > manifest.tmp
          mv manifest.tmp extension/manifest.json
      - run: node --test
        working-directory: extension
      - name: Check the extension
        run: npx --yes web-ext@10.8.0 lint --source-dir extension --ignore-files "test/**"
      - name: Package for Chromium
        run: |
          mkdir -p dist
          (cd extension && zip -qr "../dist/familiard-extension-$GITHUB_REF_NAME-chromium.zip" . -x 'test/*')
      - name: Attach the Chromium package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
      - name: Sign for Firefox and Zen
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: >
          npx --yes web-ext@10.8.0 sign
          --source-dir extension
          --ignore-files "test/**"
          --channel unlisted
          --artifacts-dir signed
      - name: Attach the signed package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xpi=$(ls signed/*.xpi)
          test "$(printf '%s\n' "$xpi" | wc -l)" = 1
          cp "$xpi" "dist/familiard-extension-$GITHUB_REF_NAME-firefox.xpi"
          gh release upload "$GITHUB_REF_NAME" dist/*.xpi --repo "$GITHUB_REPOSITORY"
